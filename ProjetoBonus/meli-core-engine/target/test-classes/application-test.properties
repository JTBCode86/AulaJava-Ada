# Nome da Aplicação em Perfil de Teste
spring.application.name=melicore-checkout-engine-test

# Configuração da Base de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desativa o Flyway durante os testes unitários/integrados leves
spring.flyway.enabled=false

# Impede o Spring de procurar scripts schema.sql/data.sql que geram erro no H2
spring.sql.init.mode=never
spring.datasource.initialization-mode=never

# Configuração do Kafka Embarcado
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=test-group

# Agendamento desativado nos testes para evitar execuções paralelas indesejadas
spring.main.allow-bean-definition-overriding=true

# Desativa a criação automática de Workers do Temporal durante os testes
temporal.worker.enabled=false
temporal.target=127.0.0.1:7233